apiVersion: apps/v1
kind: Deployment
metadata:
  name: polaris-gateway
spec:
  replicas: 2
  selector:
    matchLabels: { app: polaris-gateway }
  template:
    metadata:
      labels: { app: polaris-gateway }
    spec:
      containers:
        - name: gateway
          image: ghcr.io/polaris/platform/gateway:1.0.0
          ports: [{ containerPort: 8800 }]
